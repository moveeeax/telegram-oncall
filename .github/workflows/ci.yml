name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race -count=1 ./...

      # The README tells people to run these. If they stop working, CI fails.
      - name: Smoke-test the documented examples
        run: |
          go run ./cmd/oncall validate -c examples/oncall.yaml
          go run ./cmd/oncall whoison -c examples/oncall.yaml -at 2026-03-13T22:41:07Z
          go run ./cmd/oncall route -c examples/oncall.yaml -f examples/alertmanager-firing.json \
            -at 2026-03-13T22:41:07Z
          go run ./cmd/oncall simulate -c examples/oncall.yaml -f examples/alertmanager-firing.json \
            -ack-after 3m -ack-by bob -until 30m
          db="$RUNNER_TEMP/shift.db"
          go run ./cmd/oncall simulate -c examples/oncall.yaml -until 30m -db "$db" \
            -f examples/alertmanager-firing.json -ack-after 3m -ack-by bob
          go run ./cmd/oncall simulate -c examples/oncall.yaml -until 30m -db "$db" \
            -f examples/generic.json
          go run ./cmd/oncall handoff -db "$db" -c examples/oncall.yaml -rota primary \
            -until 2026-03-16T09:00:00Z
          go run ./cmd/oncall handoff -db "$db" -c examples/oncall.yaml -rota primary \
            -until 2026-03-16T09:00:00Z -format short
